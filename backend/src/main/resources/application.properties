spring.application.name=tracker

spring.datasource.url=jdbc:h2:mem:tracker
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Segredo de DEV apenas - em produção, injetar via variável de ambiente (JWT_SECRET)
jwt.secret=${JWT_SECRET:dev-only-secret-nao-usar-em-producao-tem-que-ter-32-bytes-no-minimo}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# API externa de cotações (brapi.dev)
cotacoes.brapi.base-url=https://brapi.dev/api
cotacoes.atualizacao.cron=0 */15 * * * *
