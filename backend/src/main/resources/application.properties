spring.application.name=tracker

spring.datasource.url=jdbc:postgresql://localhost:5432/tracker
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=tracker
spring.datasource.password=tracker

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Segredo de DEV apenas - em produção, injetar via variável de ambiente (JWT_SECRET)
jwt.secret=${JWT_SECRET:dev-only-secret-nao-usar-em-producao-tem-que-ter-32-bytes-no-minimo}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# API externa de cotações (brapi.dev) - token gratuito em https://brapi.dev/dashboard
cotacoes.brapi.base-url=https://brapi.dev/api
cotacoes.brapi.token=${BRAPI_TOKEN:}
cotacoes.atualizacao.cron=0 */15 * * * *
